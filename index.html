<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gram Shakti - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans Devanagari', sans-serif; 
            background-color: #fdfaf5; 
            -webkit-tap-highlight-color: transparent;
        }
        .golden-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .brown-gradient {
            background: linear-gradient(135deg, #4e342e 0%, #212121 100%);
        }
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #212121; display: flex; align-items: center;
            justify-content: center; z-index: 9999; transition: opacity 0.5s ease;
        }
        .premium-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(139, 94, 0, 0.1);
            border: 1px solid #f3e5f5;
            transition: transform 0.2s;
        }
        /* नोटिस बोर्ड एनीमेशन */
        .marquee {
            overflow: hidden;
            white-space: nowrap;
            background: #fff3cd;
            color: #856404;
            padding: 5px 0;
            font-size: 12px;
            font-weight: bold;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate(100%, 0); }
            100% { transform: translate(-100%, 0); }
        }
        .emergency-btn {
            position: fixed; bottom: 100px; right: 20px;
            background: #ef4444; color: white; width: 55px; height: 55px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 24px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            z-index: 50; text-decoration: none;
        }
    </style>
</head>
<body class="pb-24">

    <div id="splash">
        <div class="text-center">
            <h1 class="text-5xl golden-text mb-2 italic">Gram Shakti</h1>
            <p class="text-gray-400 text-xs tracking-[0.3em] uppercase">Rural Digital Revolution</p>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        
        <div class="brown-gradient p-8 rounded-b-[3rem] shadow-2xl text-center">
            <h1 class="text-4xl golden-text italic">Gram Shakti</h1>
            <p class="text-gray-300 text-[10px] mt-1 tracking-widest uppercase">Work • Services • Local Market</p>
            
            <div class="mt-6 flex bg-white rounded-2xl p-2 shadow-inner border border-[#bf953f]/30">
                <input type="text" id="searchInput" placeholder="पिन कोड, शहर या वर्कर खोजें..." 
                       class="flex-1 p-2 outline-none text-sm text-gray-700 bg-transparent px-4">
                <button onclick="searchData()" class="brown-gradient text-[#fcf6ba] px-6 py-2 rounded-xl font-bold text-sm">खोजें</button>
            </div>
        </div>

        <div class="marquee mt-2">
            <div class="marquee-content">
                🔔 सूचना: कल गाँव में बिजली 2 से 5 बजे तक बंद रहेगी | 🌾 मंडी भाव: धान ₹2150, मक्का ₹1900 | 🏢 नई जॉब: सिक्योरिटी गार्ड की ज़रूरत (5 पद)
            </div>
        </div>

        <div class="px-4 mt-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="location.href='worker.html'" class="premium-card p-6 flex flex-col items-center border-b-4 border-green-600">
                    <span class="text-4xl mb-2">🛠️</span>
                    <span class="font-bold text-gray-800 text-sm">वर्कर और दुकान</span>
                    <span class="text-[9px] text-gray-500 uppercase mt-1">सभी ज़रूरत की चीज़ें</span>
                </button>
                <button onclick="location.href='business.html'" class="premium-card p-6 flex flex-col items-center border-b-4 border-blue-600">
                    <span class="text-4xl mb-2">💼</span>
                    <span class="font-bold text-gray-800 text-sm">कंपनी जॉब्स</span>
                    <span class="text-[9px] text-gray-500 uppercase mt-1">नौकरी या विज्ञापन दें</span>
                </button>
            </div>
        </div>

        <div class="p-4 space-y-6 mt-4">
            <section>
                <h2 class="text-[#8d6e63] font-bold text-lg mb-3 flex items-center">
                    <span class="w-2 h-6 bg-[#bf953f] rounded-full mr-2"></span> ताज़ा अपडेट (Live)
                </h2>
                <div id="liveList" class="space-y-4"></div>
            </section>
        </div>
    </div>

    <a href="tel:108" class="emergency-btn">🚑</a>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-3 flex justify-around shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
        <div class="flex flex-col items-center text-[#bf953f]">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold">होम</span>
        </div>
        <div onclick="location.href='dashboard.html'" class="flex flex-col items-center text-gray-400 cursor-pointer">
            <span class="text-xl">📊</span>
            <span class="text-[10px] font-bold">डैशबोर्ड</span>
        </div>
        <div onclick="location.href='contact.html'" class="flex flex-col items-center text-gray-400 cursor-pointer">
            <span class="text-xl">🎧</span>
            <span class="text-[10px] font-bold">सपोर्ट</span>
        </div>
    </div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyA0J8TCjU2wxDNmT2O4VMfchY06arTO-O0",
      databaseURL: "https://gram-shakti-app-2367b-default-rtdb.firebaseio.com",
      projectId: "gram-shakti-app-2367b",
    };
    firebase.initializeApp(firebaseConfig);

    setTimeout(() => {
        document.getElementById("splash").style.opacity = "0";
        setTimeout(() => {
            document.getElementById("splash").style.display = "none";
            document.getElementById("mainApp").classList.remove("hidden");
        }, 500);
    }, 2500);

    // डेटा रेंडरिंग (Live Update Section)
    firebase.database().ref("users").limitToLast(10).on("value", function(snapshot){
        var data = snapshot.val();
        var liveHTML = "";
        
        for(var key in data){
            var user = data[key];
            liveHTML += `
                <div class="premium-card p-4 border-l-4 ${user.type == 'worker' ? 'border-green-500' : 'border-blue-500'}">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-gray-800">${user.name}</h3>
                            <p class="text-[10px] text-gray-500">${user.work || 'नई जॉब पोस्ट'}</p>
                        </div>
                        <span class="text-[10px] bg-gray-100 px-2 py-1 rounded text-gray-400 italic">${user.city}</span>
                    </div>
                </div>`;
        }
        document.getElementById("liveList").innerHTML = liveHTML || "<p class='text-center text-gray-300'>अभी कोई अपडेट नहीं है</p>";
    });

    function searchData(){
        var input = document.getElementById("searchInput").value.toLowerCase();
        if(input.length < 1) return alert("कृपया कुछ लिखें");
        // यहाँ आप सर्च रिज़ल्ट पेज पर नेविगेट भी कर सकते हैं
        location.href = "worker.html?search=" + input;
    }
</script>
</body>
</html>
